# Outdoor overrides: larger voxels for sparse, far returns. Load after the base config
# (`ros2 launch fast_lio mapping.launch.py outdoor:=true`, or a second --params-file).
/**:
    ros__parameters:
        filter_size_surf: 0.5            # scan voxel [m]
        voxel_map:
            size: 0.5                    # map voxel edge [m]
