# Outdoor overrides for the voxel map: load after the base config (g1_mid360.yaml, mid360.yaml or
# dataset_mid360.yaml), e.g. `ros2 launch fast_lio mapping.launch.py outdoor:=true`, or a second
# --params-file. Larger voxels for sparse, far returns: on the TIERS roads 0.5 m gives 5.2 cm APE against
# 5.3-6.2 cm at 0.35 m and 5.5-5.6 cm for the stock ikd-Tree (results/mac/voxel2_study, "Outdoor voxel size").
/**:
    ros__parameters:
        filter_size_surf: 0.5            # scan voxel [m]
        voxel_map:
            size: 0.5                    # map voxel edge [m]
