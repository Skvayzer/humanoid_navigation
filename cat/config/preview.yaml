/g1_cat/cat_perception_preview:
  ros__parameters:
    # Existing full 3D TF: map -> world -> camera_init -> body. Never Nav2's
    # planar base, raw livox_frame, or another ground/gravity rotation.
    input_topic: /g1_slam/cloud_registered_body
    source_frame: body
    fixed_frame: map
    floor_z: 0.0
    ground_cutoff: 0.10
    sensor_origin_body: [-0.011, -0.02329, 0.04412]
    rate_hz: 1.0
    max_points: 20000
    max_range: 2.5
    max_receive_age: 0.5
    max_tf_delta: 0.25
    map_reset_seconds: 10.0
    max_octomap_nodes: 1000000
    snapshot_directory: /data
    snapshot_every: 5
    arm_token: /run/g1_nav/g1_motion_armed
