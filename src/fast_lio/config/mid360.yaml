/**:
    ros__parameters:
        # max_iteration N allows up to N+1 iterated updates per scan. Map neighbours are searched again
        # after an update converges (all |dx| < 0.001), or before the last update if none has; the loop
        # stops after the second converged update.
        max_iteration: 3
        # num_threads: 3               # OpenMP threads of the matching loop (default by core count: 3 with > 4 cores)
        # Voxel-map configuration (results/mac/voxel2_study), indoor; outdoor: load outdoor.yaml after this file.
        filter_size_surf: 0.35           # scan voxel [m] (outdoor 0.5)
        filter_size_map: 0.5             # ikd-Tree map only
        map_type: "voxel"                # voxel map (include/voxel_map.h); "ikdtree": the stock FAST-LIO map
        voxel_map:
            size: 0.35                   # map voxel edge [m] (outdoor 0.5)
            stored_points: 10            # points kept per voxel; from this many on it has a distribution
            max_points: 30               # the voxel freezes at this count (0: never)
            merge_angle_deg: 0.0         # coplanar merging off (5.0 / 0.02: better on JEPLO, worse on the G1 walk)
            merge_distance: 0.02
            min_points: 20               # plane test for merging: points, std. deviation across [m], and
            max_thickness: 0.03          #   smallest/middle eigenvalue ratio (rejects lines)
            planarity: 0.05
        scan_patch:
            min_points: 5                # a scan voxel with >= 5 points is one measurement: centroid + covariance
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).

        preprocess:
            lidar_type: 1                # 1: livox_ros_driver2 CustomMsg; 2: PointCloud2 with a per-point time field
                                         # (time_field, timestamp_unit, time_absolute; e.g. livox_ros_driver2
                                         # PointCloud2: time_field "timestamp", unit 3, time_absolute true)
            scan_line:  4
            blind: 0.5
            point_keep_ratio: 0.5        # share of the points beyond blind kept (random, no fixed pattern)
            timestamp_unit: 3

        mapping:
            map_insert_rule: "closest_to_centre"  # or "first_point" (no voxel-grid bias)
            acc_cov: 0.3                 # 0.1 slips in the walking-G1 corridor (results/mac/imu_study)
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            det_range:     100.0
            extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true            # map_save service: writes the ikd-Tree map to map_file_path
