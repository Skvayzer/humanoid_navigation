# Offline evaluation on recorded Mid-360 datasets: fastlio_mapping --replay, or a ROS 2 player publishing
# /replay/lidar and /replay/imu. The replays carry the lidar as PointCloud2 with a per-point `time` [ns]
# after the header stamp. Parameters are documented in mid360.yaml; [DS] marks the evaluation's own lines.
# FAST-LIO's own configuration, as a baseline: map_type ikdtree, filter_size_surf 0.5,
# scan_patch.min_points 0, point_keep_ratio 0.33, acc_cov 0.1 and acc_range 0.
/**:
    ros__parameters:
        max_iteration: 3
        map_type: "voxel"
        filter_size_surf: 0.35
        filter_size_map: 0.5
        cube_side_length: 1000.0
        voxel_map:
            size: 0.35
            point_sigma: 0.02
            shape_ratio: 1.0
            min_n_eff: 6.0
            freeze_sigma: 0.004
            pooled_thickness: 0.1
            pooled_planarity: 0.2
        scan_patch:
            min_points: 5
            sigma_floor: 0.02
            planar_ratio: 0.1
        runtime_pos_log_enable: true     # [DS]
        map_save: false                  # [DS]
        map_file_path: ""                # [DS]

        common:
            lid_topic:  "/replay/lidar"  # [DS]
            imu_topic:  "/replay/imu"    # [DS]
            lidar_reliable: true         # [DS] no scans lost in transport, so runs are repeatable
            time_offset_lidar_to_imu: 0.0

        imu_restamp:
            enable: true                 # [DS] as on the G1; TIERS indoor has host stamps that stall

        preprocess:
            lidar_type: 2                # [DS]
            scan_line: 4
            blind: 0.5
            point_keep_ratio: 0.5
            timestamp_unit: 3            # [DS]

        mapping:
            acc_cov: 0.3
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            acc_range: 4.0
            acc_satu_cov: 30.0
            imu_init_time: 0.0           # [DS] one scan's IMU samples: most datasets move right away
            det_range: 100.0
            extrinsic_est_en: false      # [DS] factory calibration
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:                         # odometry: the defaults (/Odometry, imu frame, once per scan)
            path_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false # [DS]
