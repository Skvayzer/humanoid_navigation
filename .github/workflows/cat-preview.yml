name: CAT perception ARM64
on:
  push:
    branches: [feature/cat-perception-preview]
    paths: ['cat/**', '.github/workflows/cat-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify_source.sh
      - name: Host launcher regression (fake Docker, no daemon calls)
        run: python3 -m unittest discover -s cat/tests -p test_launcher.py -v
      - run: bash cat/scripts/build.sh
      - name: Offline native tests and ROS import (no robot network)
        run: bash cat/scripts/container.sh validate
      - name: Pinned checkpoint integrity and offline ONNX smoke (no ROS)
        run: |
          python3 -m venv /tmp/cat-checkpoint-check
          /tmp/cat-checkpoint-check/bin/pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1
          /tmp/cat-checkpoint-check/bin/python cat/checkpoint.py fetch
          /tmp/cat-checkpoint-check/bin/python cat/checkpoint.py smoke
