# FAST_LIO_G1 on NTU VIRAL eee_01-03 (2 x Ouster OS1-16, VN100 IMU ~385 Hz), corrected calibration.
# Input: PointCloud2 on /replay/lidar with a per-point `time` [ns] after the scan start, IMU on /replay/imu.
# The vertical Ouster's points are merged into the horizontal one's scan; the extrinsic is the horizontal Ouster's.
# Parameters not set here are as in config/dataset_mid360.yaml + config/outdoor.yaml.
/**:
    ros__parameters:
        max_iteration: 3
        map_type: "voxel"
        filter_size_surf: 0.4
        voxel_map:
            size: 0.5                    # as config/outdoor.yaml
            point_sigma: 0.02
            shape_ratio: 1.0
            min_n_eff: 6.0
            freeze_sigma: 0.004
            pooled_thickness: 0.1
            pooled_planarity: 0.2
        scan_patch:
            min_points: 5
            sigma_floor: 0.02
            planar_ratio: 0.1
        runtime_pos_log_enable: true
        map_save: false
        map_file_path: ""

        common:
            lid_topic:  "/replay/lidar"
            imu_topic:  "/replay/imu"
            lidar_reliable: true
            time_offset_lidar_to_imu: 0

        preprocess:
            lidar_type: 2
            scan_line: 16
            blind: 0.3
            point_keep_ratio: 0.5
            time_field: "time"
            timestamp_unit: 3

        mapping:
            gyr_cov: 1.3498e-05               # gyroscope noise 0.00367397 per sample
            acc_cov: 0.00133541               # accelerometer noise 0.0365432 per sample
            b_gyr_cov: 7.0756e-10             # gyroscope random walk 2.66e-05
            b_acc_cov: 1.87489e-07            # accelerometer random walk 0.000433
            acc_range: 0.0                    # no saturation model
            acc_satu_cov: 30.0
            imu_init_time: 1
            extrinsic_est_en: false
            extrinsic_T: [ -0.05, 0, 0.055 ]   # lidar to IMU
            extrinsic_R: [ 1, 0, 0,
                           0, 1, 0,
                           0, 0, 1 ]

        publish:
            path_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false
