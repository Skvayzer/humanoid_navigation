# g1.sh viz: the ONLY path between the robot (domain 0) and foxglove_bridge (domain 7, loopback).
# Down (0 -> 7): the viewer topics; the heavy ones only once the viewer subscribes to them (wait_for_subscription).
# Up (7 -> 0): the five executor operator inputs and /initialpose (the relocalization hint: the 3D panel's pose
# estimate, relayed to FAST-LIO by slam/floor_anchor.py), nothing else -- the viewer can never publish /lowcmd or any
# other robot topic (foxglove_bridge 3.6.3 ignores its own client_topic_whitelist).
# Not here: /g1_wb/virtual_scene (MarkerArray changed between Foxy and Humble) -> foxglove/marker_relay.py.
name: g1_viz
from_domain: 0
to_domain: 7
topics:
  /tf:
    type: tf2_msgs/msg/TFMessage
  /tf_static:
    type: tf2_msgs/msg/TFMessage
  /rosout:
    type: rcl_interfaces/msg/Log
  /g1_wb/status:
    type: std_msgs/msg/String
  /g1_wb/pelvis:
    type: geometry_msgs/msg/PoseStamped
  /g1_wb/goal:
    type: geometry_msgs/msg/PoseStamped
  /g1_wb/sites:
    type: sensor_msgs/msg/PointCloud2
  /g1_wb/esdf_cube:
    type: sensor_msgs/msg/Image
    wait_for_subscription: true
  /g1_wb/obstacles_band:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_wb/sdf_slice:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_wb/ar/compressed:
    type: sensor_msgs/msg/CompressedImage
    wait_for_subscription: true
  /g1_slam/odometry:
    type: nav_msgs/msg/Odometry
    wait_for_subscription: true
  /g1_slam/path:
    type: nav_msgs/msg/Path
    wait_for_subscription: true
  /g1_slam/obstacles:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_slam/map:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_slam/lio_map:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_slam/prior_map:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_slam/cloud_registered:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /utlidar/cloud_livox_mid360:
    type: sensor_msgs/msg/PointCloud2
    wait_for_subscription: true
  /g1_wb/operator:
    type: std_msgs/msg/String
    reversed: true
  /g1_wb/scene:
    type: std_msgs/msg/String
    reversed: true
  /g1_wb/obstacle_mode:
    type: std_msgs/msg/String
    reversed: true
  /g1_wb/speed:
    type: std_msgs/msg/String
    reversed: true
  /g1_wb/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    reversed: true
  /initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    reversed: true
