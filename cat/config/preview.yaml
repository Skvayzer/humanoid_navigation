/g1_cat/cat_perception_preview:
  ros__parameters:
    # Raw Livox points + sensor-time map->body poses. Apply G1's known
    # LiDAR-to-IMU extrinsics once; never use a fabricated livox_frame TF.
    input_topic: /livox/lidar
    source_frame: livox_frame
    fixed_frame: map
    floor_z: 0.0
    ground_cutoff: 0.10
    sensor_origin_body: [-0.011, -0.02329, 0.04412]
    rate_hz: 1.0
    max_points: 20000
    max_range: 2.5
    min_range: 0.0  # no software blind zone; zero/nonfinite/invalid returns rejected
    max_receive_age: 1.5
    max_output_age: 2.0
    display_hold_seconds: 3.0
    cell_ttl_seconds: 30.0
    max_octomap_nodes: 1000000
    snapshot_directory: /data
    snapshot_every: 5
