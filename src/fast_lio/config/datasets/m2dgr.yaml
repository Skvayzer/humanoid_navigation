# FAST_LIO_G1 on M2DGR room_01-03 (Velodyne VLP-32C, Handsfree IMU 150 Hz).
# Input: PointCloud2 on /replay/lidar with a per-point `time` [ns] after the scan start, IMU on /replay/imu.
# Parameters not set here are as in config/dataset_mid360.yaml.
/**:
    ros__parameters:
        max_iteration: 3
        map_type: "voxel"
        filter_size_surf: 0.3
        voxel_map:
            size: 0.35                    # as config/dataset_mid360.yaml
            point_sigma: 0.02
            shape_ratio: 1.0
            min_n_eff: 6.0
            freeze_sigma: 0.004
            pooled_thickness: 0.1
            pooled_planarity: 0.2
        scan_patch:
            min_points: 5
            sigma_floor: 0.02
            planar_ratio: 0.1
        runtime_pos_log_enable: true
        map_save: false
        map_file_path: ""

        common:
            lid_topic:  "/replay/lidar"
            imu_topic:  "/replay/imu"
            lidar_reliable: true
            time_offset_lidar_to_imu: 0

        preprocess:
            lidar_type: 2
            scan_line: 32
            blind: 0.01
            point_keep_ratio: 1
            time_field: "time"
            timestamp_unit: 3

        mapping:
            gyr_cov: 5.48381e-06              # gyroscope noise 0.00234175 per sample
            acc_cov: 0.00142026               # accelerometer noise 0.0376863 per sample
            b_gyr_cov: 2.08179e-10            # gyroscope random walk 1.44284e-05
            b_acc_cov: 1.3034e-06             # accelerometer random walk 0.00114166
            acc_range: 0.0                    # no saturation model
            acc_satu_cov: 30.0
            imu_init_time: 1
            extrinsic_est_en: false
            extrinsic_T: [ 0.27255, -0.00053, 0.17954 ]   # lidar to IMU
            extrinsic_R: [ 1, 0, 0,
                           0, 1, 0,
                           0, 0, 1 ]

        publish:
            path_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false
