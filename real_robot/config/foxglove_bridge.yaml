# foxglove_bridge for the real-robot stack (g1.sh viz): robot localhost only (reach it through an SSH tunnel), our
# topics only, and the viewer may publish only the executor's operator inputs -- never /lowcmd or anything else.
foxglove_bridge:
  ros__parameters:
    port: 8765
    address: 127.0.0.1
    topic_whitelist: ['^/g1_wb/.*', '^/g1_slam/.*', '^/tf$', '^/tf_static$', '^/rosout$', '^/utlidar/cloud_livox_mid360$']
    client_topic_whitelist: ['^/g1_wb/(operator|scene|obstacle_mode|goal_pose|speed)$']
    capabilities: [clientPublish]
    service_whitelist: ['^$']
    param_whitelist: ['^$']
    send_buffer_limit: 4000000      # bytes queued per client before old messages are dropped (a slow WiFi lags, not grows)
    num_threads: 2
    max_qos_depth: 5
